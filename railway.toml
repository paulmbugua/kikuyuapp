[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && yarn install --immutable && yarn workspace @kikuyu/backend build"

[deploy]
startCommand = "yarn workspace @kikuyu/backend start"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
